name: 🛡️ Secret Scanning

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  # 也支持手动触发
  workflow_dispatch:

jobs:
  scan-credentials:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for hardcoded secrets in PR changes
        shell: bash
        run: |
          set -euo pipefail

          # 只在 PR/commit diff 中扫描新增代码，避免既有遗留问题报警
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
            DIFF_SCOPE="$BASE_SHA..$HEAD_SHA"
          else
            # push 事件：对比上一次提交
            DIFF_SCOPE="HEAD~1..HEAD"
          fi

          VIOLATIONS=0

          # ---- 规则 1: 禁止提交 .env 文件（.env.example 除外） ----
          ENV_FILES=$(git diff "$DIFF_SCOPE" --diff-filter=A --name-only | grep -E '^\.env$|^\.env\.(prod|production|staging|dev)$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ 违规：新增的 .env 文件被提交到 git"
            echo "$ENV_FILES"
            VIOLATIONS=$((VIOLATIONS+1))
          fi

          # ---- 规则 2: 检测硬编码 JWT/API 密钥 ----
          # 匹配形如 JWT_SECRET=xxx 或 "password": "xxxxx" 且值不是 <CHANGE_ME> 也不是环境变量引用
          PATTERNS=(
            # JWT secrets with non-placeholder values
            'JWT_SECRET[[:space:]]*[=:][[:space:]]*['"'"'"]?[a-fA-F0-9]{32,}'
            'JWT_SECRET_SSO[[:space:]]*[=:][[:space:]]*['"'"'"]?[a-fA-F0-9]{32,}'
            # Hardcoded passwords that look real (not placeholders)
            'password[[:space:]]*[=:][[:space:]]*['"'"'"]?(?!<CHANGE_ME|\$|\{)([A-Za-z0-9_!@#$%^&*]{16,})'
            # PostgreSQL connection strings with embedded password
            'postgresql?://[a-zA-Z_]+:[^@<{ ]{4,}@'
            # Generic secrets/keys
            'secret[[:space:]]*[=:][[:space:]]*['"'"'"]?(?!<CHANGE_ME|\$|\{)[A-Za-z0-9_!@#$%^&*]{20,}'
            'api[_-]?key[[:space:]]*[=:][[:space:]]*['"'"'"]?(?!<CHANGE_ME|\$|\{)[A-Za-z0-9_!@#$%^&*]{16,}'
          )

          # 逐个模式扫描 diff
          for pattern in "${PATTERNS[@]}"; do
            MATCHES=$(git diff "$DIFF_SCOPE" -G "$pattern" -- ':(exclude)*.md' ':(exclude)*.spec.ts' ':(exclude)*.test.ts' ':(exclude)*.test.rs' ':(exclude).env.example' ':(exclude)docs/*' ':(exclude)scripts/sso-env' --diff-filter=AM 2>/dev/null | grep -E "$pattern" || true)
            if [ -n "$MATCHES" ]; then
              echo "❌ 可能的硬编码密钥（pattern: $pattern）"
              echo "$MATCHES"
              VIOLATIONS=$((VIOLATIONS+1))
            fi
          done

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo ""
            echo "==========================================="
            echo "  🚨 发现 $VIOLATIONS 个安全违规项"
            echo "  如果你确实需要提交这些文件，请 review 并确保："
            echo "  - 使用环境变量引用（${VAR_NAME}）而不是硬编码值"
            echo "  - 占位符使用 <CHANGE_ME-xxx> 格式"
            echo "  - 不是生产环境真实密钥"
            echo "==========================================="
            exit 1
          fi

          echo "✅ 未发现硬编码密钥"

      - name: 📋 List all tracked .env/*secret files (informational)
        shell: bash
        run: |
          echo "=== ⚠️ 以下跟踪的文件包含 'secret'/'password'/'token' 关键字 ==="
          git ls-files | xargs grep -l -iE '(password|secret|token|key)[[:space:]]*[=:][[:space:]]*' 2>/dev/null | sort || true
